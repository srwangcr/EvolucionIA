[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolucionia"
version = "0.2.0"
description = "Simulación de mercado con agentes heterogéneos, motor en Rust (M3), persistencia SQL y dashboard interactivo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deap>=1.4.1",
    "alembic>=1.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
    "sqlalchemy>=2.0",
    "streamlit>=1.37",
    "polars>=1.0",
    "optuna>=3.6",
    "maturin>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
rust = [
    "maturin>=1.7",
]

[project.scripts]
evolucionia = "evolucionia.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]